name: calendar-bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

# Одновременно работает один запуск, следующий ждёт в очереди
concurrency:
  group: calendar-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          ALLOWED_USER_IDS: ${{ secrets.ALLOWED_USER_IDS }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Europe/Moscow' }}

      - name: Запустить следующий прогон
        if: always()
        run: |
          sleep 10
          for i in 1 2 3 4 5 6; do
            if gh workflow run "calendar-bot"; then exit 0; fi
            echo "Попытка $i не удалась, жду"
            sleep $((i * 15))
          done
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
          
